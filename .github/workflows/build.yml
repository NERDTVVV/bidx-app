name: Build BidX APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.0'

      - name: Generate app icons
        run: |
          sudo apt-get install -y python3-pip python3-pil
          python3 << 'PYEOF'
          from PIL import Image, ImageDraw, ImageFont
          import os

          def create_icon(size):
              img = Image.new('RGBA', (size, size), (0, 0, 0, 0))
              draw = ImageDraw.Draw(img)
              radius = size // 5
              draw.rounded_rectangle([0, 0, size-1, size-1], radius=radius, fill=(13, 13, 13, 255))
              colors = ['#e53238', '#f5af02', '#86b817', '#3665f3']
              letters = ['B', 'i', 'd', 'X']
              font_size = size // 3
              try:
                  font = ImageFont.truetype("/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf", font_size)
              except:
                  font = ImageFont.load_default()
              total_w = 0
              widths = []
              for l in letters:
                  bbox = draw.textbbox((0,0), l, font=font)
                  w = bbox[2] - bbox[0]
                  widths.append(w)
                  total_w += w + size//20
              x = (size - total_w) // 2
              y = size // 3
              for i, (letter, color) in enumerate(zip(letters, colors)):
                  draw.text((x, y), letter, font=font, fill=color)
                  x += widths[i] + size//20
              return img

          sizes = {
              'mipmap-hdpi': 72,
              'mipmap-xhdpi': 96,
              'mipmap-xxhdpi': 144,
              'mipmap-xxxhdpi': 192,
          }

          for folder, size in sizes.items():
              path = f'app/src/main/res/{folder}'
              os.makedirs(path, exist_ok=True)
              img = create_icon(size)
              img.save(f'{path}/ic_launcher.png')
              print(f'Created {path}/ic_launcher.png ({size}x{size})')
          PYEOF

      - name: Build Debug APK
        run: gradle assembleDebug
        working-directory: .

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BidX-APK
          path: app/build/outputs/apk/debug/app-debug.apk
